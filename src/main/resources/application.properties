#   BACKEND
server.port=8080
spring.application.name=bandu-airlines-backend

#   DATABASE - POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bandu_airlines_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#   JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#   ACTUATOR
management.endpoints.web.exposure.include=health

#   SEGURIDAD
# false = todo abierto (desarrollo mientras CUENTA no entregue el JWT). Pasar a true cuando CUENTA termine.
app.security.enabled=${SECURITY_ENABLED:false}

#   CORS (INTEGRA). Lista separada por comas; admite patrones, p. ej. http://localhost:*
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# JWT - MODULO CUENTAS

# Clave secreta en Base64 (minimo 256 bits)
app.jwt.secret=${JWT_SECRET}
# Duracion access token: 15 minutos
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Duracion refresh token: 7 dias
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

#   FLOW (lo usa el módulo PAGOS)
bandu.flow.api-key=${FLOW_API_KEY:}
bandu.flow.secret-key=${FLOW_SECRET_KEY:}
bandu.flow.api-url=${FLOW_API_URL:https://sandbox.flow.cl/api}
bandu.flow.url-confirmacion=${FLOW_URL_CONFIRMACION:http://localhost:8080/api/v1/pagos/notificaciones}

#   PRIMER ADMINISTRADOR (solo producción; ver README)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}