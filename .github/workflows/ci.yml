name: Backend Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isoft-ufro/banduairlines-backend

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and run Commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  compile_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        run: mvn clean package -DskipTests

  deploy:
    name: Construir, Publicar y Desplegar
    needs: compile_backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Autenticar en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Despliegue VPS y Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/integracion/banduairlines-infra

            # 1. Servicio y URL de salud según la rama
            if [ "${{ github.ref_name }}" = "main" ]; then
              SERVICE_NAME="backend-main"
              TARGET_URL="https://isoft.lazycat.app/actuator/health"
            else
              SERVICE_NAME="backend-develop"
              TARGET_URL="https://dev.isoft.lazycat.app/actuator/health"
            fi

            mostrar_diagnostico() {
              echo "================ DIAGNÓSTICO ================"
              docker compose ps -a
              CID=$(docker compose ps -aq $SERVICE_NAME)
              docker inspect "$CID" --format 'Estado={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Reinicios={{.RestartCount}}'
              echo "---------------- Logs de $SERVICE_NAME ----------------"
              docker compose logs --no-color --tail=150 $SERVICE_NAME
              echo "---------------- Logs de caddy ----------------"
              docker compose logs --no-color --tail=40 caddy
              echo "============================================="
            }

            # 2. Actualiza y reinicia solo el servicio de esta rama
            echo "Desplegando servicio $SERVICE_NAME..."
            docker compose pull $SERVICE_NAME
            docker compose up -d $SERVICE_NAME

            # 3. Espera inicial (Spring Boot tarda ~25 s en arrancar)
            echo "Esperando 20 segundos a que la aplicación Spring Boot inicie..."
            sleep 20

            # 4. Healthcheck con reintentos; se corta si el contenedor cae
            SUCCESS=0
            for i in {1..18}; do
              CID=$(docker compose ps -aq $SERVICE_NAME)
              ESTADO=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || echo "desconocido")
              if [ "$ESTADO" != "running" ]; then
                echo "El contenedor no está en ejecución (estado: $ESTADO). Abortando espera."
                break
              fi

              echo "Intento $i de verificación en $TARGET_URL..."
              HTTP_CODE=$(curl -s -m 5 -o /dev/null -w "%{http_code}" $TARGET_URL || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "Verificación de salud exitosa (Código HTTP 200)"
                SUCCESS=1
                break
              fi
              echo "Respuesta HTTP: $HTTP_CODE. Esperando 5 segundos más..."
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Fallo en la verificación de salud."
              mostrar_diagnostico
              exit 1
            fi